name: Build Turbo Download Manager APK

on:
  workflow_dispatch:
  push:
    paths:
      - "TurboDownloadManager-project.zip"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --licenses <<< "y" || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 2 -type f -name 'TurboDownloadManager-project.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: TurboDownloadManager-project.zip was not found."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR="$(find extracted -type f -name 'settings.gradle.kts' -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found inside the ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify project
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          find . -maxdepth 2 -type f | sort

          echo "Checking Gradle project..."
          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK_FILE="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK_FILE"

          mkdir -p artifact
          cp "$APK_FILE" artifact/TurboDownloadManager-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TurboDownloadManager-debug
          path: artifact/TurboDownloadManager-debug.apk
          if-no-files-found: error
          retention-days: 30
